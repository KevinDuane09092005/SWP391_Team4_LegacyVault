openapi: 3.0.3
info:
  title: LegacyVault - Legal Verification API (Flow 5)
  description: >
    API specification cho Flow 5 của LegacyVault: Legal Verification (Xác minh Pháp lý).
    Được đồng bộ chính xác với UI Prototype màn hình:
      - `Flow 5 - Legal Verification` (Hàng đợi thẩm định, mở rộng xem chi tiết hồ sơ & chứng tử)
      - `Flow 5b - Legal Verification (Approved)` (Trạng thái đã phê duyệt & thông báo xác nhận mở khóa)
    
    Quy trình nghiệp vụ:
      1. Digital Executor tiếp nhận Handover Case (tự động khởi tạo sau khi DMS triggered ở Flow 4).
      2. Executor tải lên Giấy chứng tử (Death Certificate: PDF, PNG, JPG) & nộp thẩm định.
      3. Legal Verifier (Luật sư / Công chứng viên thẩm định) xem danh sách "Legal Verification Queue".
      4. Verifier nhấp xem chi tiết hồ sơ (vd: Case #LV-1042), kiểm tra file chứng tử (`Death_Certificate_ThanhPham.pdf`, 2.1 MB).
      5. Thẩm định và đưa ra quyết định:
         - `Reject`: Nhập lý do từ chối -> Gửi thông báo đến Executor để nộp bổ sung.
         - `Approve & Sign`: Ký số điện tử (Digital Signature) phê duyệt -> Hiển thị thông báo "Case approved: Document verified successfully. Case #LV-1042 was approved and vault unlock has been authorized." -> Cấp quyền mở khóa kho di sản (Vault Unlock Token) chuyển sang Flow 6.
  version: "1.0.0"
  contact:
    name: LegacyVault Backend Team

servers:
  - url: https://api.legacyvault.io/v1
    description: Production
  - url: https://staging-api.legacyvault.io/v1
    description: Staging

tags:
  - name: Legal Verification - Verifier Queue
    description: Màn hình Legal Verification Queue dành cho Legal Verifier (Flow 5 & 5b)
  - name: Legal Verification - Executor Submission
    description: Các API dành cho Digital Executor (Upload giấy chứng tử và nộp hồ sơ)

paths:
  # =========================================================================
  # 1. VERIFIER QUEUE & ACTIONS (UI FLOW 5 & FLOW 5b)
  # =========================================================================
  /legal-verification/verifier/queue:
    get:
      tags: [Legal Verification - Verifier Queue]
      summary: Lấy danh sách hàng đợi các hồ sơ cần thẩm định (Legal Verification Queue)
      description: >
        Tương ứng màn hình chính "Legal Verification Queue" (UI Prototype Flow 5):
        Hiển thị danh sách thẻ hồ sơ gồm: Case ID (vd: Case #LV-1042), Vault Owner (Thanh Pham),
        Executor (Linh Pham), Ngày nộp (Submitted: Sep 20, 2026), và Trạng thái (Under Review, Approved).
      operationId: getVerificationQueue
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Lọc theo trạng thái thẩm định
          schema:
            type: string
            enum: [ALL, UNDER_REVIEW, APPROVED, REJECTED, SUBMITTED]
            default: ALL
        - name: search
          in: query
          description: Tìm kiếm theo mã Case ID hoặc tên Vault Owner / Executor
          schema:
            type: string
            example: "LV-1042"
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Danh sách hồ sơ trong hàng đợi thẩm định
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationQueuePageResponse'
              examples:
                prototypeView:
                  value:
                    content:
                      - case_id: "c1042-0000-1111-2222-333344445555"
                        case_number: "LV-1042"
                        vault_owner_name: "Thanh Pham"
                        executor_name: "Linh Pham"
                        submitted_date: "2026-09-20"
                        submitted_date_formatted: "Sep 20, 2026"
                        status: "UNDER_REVIEW"
                        status_label: "Under Review"
                        documents_count: 1
                      - case_id: "c1038-0000-1111-2222-333344445555"
                        case_number: "LV-1038"
                        vault_owner_name: "Maya Chen"
                        executor_name: "Daniel Chen"
                        submitted_date: "2026-09-16"
                        submitted_date_formatted: "Sep 16, 2026"
                        status: "APPROVED"
                        status_label: "Approved"
                        documents_count: 1
                    total_elements: 2
                    total_pages: 1

  /legal-verification/cases/{caseId}:
    get:
      tags: [Legal Verification - Verifier Queue]
      summary: Lấy chi tiết hồ sơ thẩm định (Case #LV-XXXX - Detail)
      description: >
        Tương ứng vùng hiển thị khi nhấp mở rộng thẻ hồ sơ "Case #LV-1042 - Detail" trên UI:
        Trả về tệp chứng từ đã tải lên (vd: Death_Certificate_ThanhPham.pdf · 2.1 MB) cùng liên kết
        tải xem trước bảo mật và trạng thái phê duyệt hiện tại.
      operationId: getVerificationCaseDetail
      security:
        - bearerAuth: []
      parameters:
        - name: caseId
          in: path
          required: true
          description: "UUID hoặc mã số Case (vd: LV-1042)"
          schema:
            type: string
      responses:
        '200':
          description: Chi tiết hồ sơ và văn bản đính kèm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationCaseDetail'
              examples:
                underReviewState:
                  value:
                    case_id: "c1042-0000-1111-2222-333344445555"
                    case_number: "LV-1042"
                    vault_owner:
                      name: "Thanh Pham"
                      email: "thanh.pham@vault-owner.com"
                    executor:
                      name: "Linh Pham"
                      email: "linh.pham@beneficiary.com"
                    status: "UNDER_REVIEW"
                    submitted_date_formatted: "Sep 20, 2026"
                    documents:
                      - document_id: "d1-0000-1111-2222-333344445555"
                        document_type: "DEATH_CERTIFICATE"
                        file_name: "Death_Certificate_ThanhPham.pdf"
                        file_size_formatted: "2.1 MB"
                        uploaded_by: "Executor"
                        file_url: "https://vault-storage.legacyvault.io/cases/LV-1042/Death_Certificate_ThanhPham.pdf?token=..."
                    review_guideline: "Confirm the document is authentic and matches the vault owner's legal record before approving this case."
        '404':
          $ref: '#/components/responses/NotFoundError'

  /legal-verification/cases/{caseId}/approve:
    post:
      tags: [Legal Verification - Verifier Queue]
      summary: Phê duyệt & Ký số điện tử (Approve & Sign)
      description: >
        Tương ứng nút bấm "Approve & Sign" trên màn hình UI Flow 5.
        Sau khi Legal Verifier xác nhận văn bản hợp lệ, hệ thống thực hiện:
          1. Ký số điện tử vào biên bản phê duyệt.
          2. Cập nhật trạng thái Case sang `APPROVED`.
          3. Kích hoạt mã cấp quyền mở khóa (Vault Unlock Authorized Token).
          4. Trả về thông báo thành công khớp với UI Flow 5b:
             "Document verified successfully. Case #LV-1042 was approved and vault unlock has been authorized."
      operationId: approveAndSignCase
      security:
        - bearerAuth: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                signature_note:
                  type: string
                  example: "Đã đối chiếu với CSDL Hộ tịch, giấy chứng tử hợp lệ."
                verifier_pin:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: Phê duyệt thành công, chuyển trạng thái sang UI Flow 5b
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveCaseResponse'
              examples:
                approvedResult:
                  value:
                    case_id: "c1042-0000-1111-2222-333344445555"
                    case_number: "LV-1042"
                    status: "APPROVED"
                    status_label: "Approved"
                    approved_title: "Case approved"
                    approved_message: "Document verified successfully. Case #LV-1042 was approved and vault unlock has been authorized."
                    vault_unlock_authorized: true
                    verified_at: "2026-09-20T10:15:30Z"

  /legal-verification/cases/{caseId}/reject:
    post:
      tags: [Legal Verification - Verifier Queue]
      summary: Từ chối hồ sơ xác minh pháp lý (Reject)
      description: >
        Tương ứng nút bấm "Reject" màu đỏ trên màn hình UI Flow 5.
        Legal Verifier ghi nhận lý do từ chối (ảnh mờ, sai lệch thông tin cá nhân).
        Hệ thống chuyển trạng thái sang `REJECTED`, gửi thông báo cho Executor để nộp bổ sung.
      operationId: rejectCase
      security:
        - bearerAuth: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  example: "Bản chụp Giấy chứng tử bị nhòe góc con dấu pháp lý, không nhận diện được chữ ký công chứng."
      responses:
        '200':
          description: Đã từ chối hồ sơ và kích hoạt thông báo cho Executor
          content:
            application/json:
              schema:
                type: object
                properties:
                  case_id:
                    type: string
                  case_number:
                    type: string
                  status:
                    type: string
                    example: "REJECTED"
                  rejection_reason:
                    type: string

  # =========================================================================
  # 2. EXECUTOR SUBMISSION ENDPOINTS
  # =========================================================================
  /legal-verification/cases/{caseId}/documents:
    post:
      tags: [Legal Verification - Executor Submission]
      summary: Executor tải lên Giấy chứng tử (Upload Death Certificate)
      operationId: uploadDeathCertificate
      security:
        - bearerAuth: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Tệp tin PDF hoặc ảnh (tối đa 15MB)
      responses:
        '201':
          description: Tải lên thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationDocumentItem'

# =========================================================================
# SCHEMAS & COMPONENTS
# =========================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    NotFoundError:
      description: Không tìm thấy hồ sơ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    VerificationQueueItem:
      type: object
      properties:
        case_id:
          type: string
          format: uuid
        case_number:
          type: string
          example: "LV-1042"
        vault_owner_name:
          type: string
          example: "Thanh Pham"
        executor_name:
          type: string
          example: "Linh Pham"
        submitted_date:
          type: string
          format: date
        submitted_date_formatted:
          type: string
          example: "Sep 20, 2026"
        status:
          type: string
          enum: [PENDING, SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED]
          example: "UNDER_REVIEW"
        status_label:
          type: string
          example: "Under Review"
        documents_count:
          type: integer
          example: 1

    VerificationQueuePageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/VerificationQueueItem'
        total_elements:
          type: integer
          example: 2
        total_pages:
          type: integer
          example: 1

    VerificationDocumentItem:
      type: object
      properties:
        document_id:
          type: string
          format: uuid
        document_type:
          type: string
          example: "DEATH_CERTIFICATE"
        file_name:
          type: string
          example: "Death_Certificate_ThanhPham.pdf"
        file_size_formatted:
          type: string
          example: "2.1 MB"
        uploaded_by:
          type: string
          example: "Executor"
        file_url:
          type: string
        file_hash_sha256:
          type: string

    VerificationCaseDetail:
      type: object
      properties:
        case_id:
          type: string
          format: uuid
        case_number:
          type: string
          example: "LV-1042"
        vault_owner:
          type: object
          properties:
            name:
              type: string
              example: "Thanh Pham"
            email:
              type: string
              example: "thanh.pham@vault-owner.com"
        executor:
          type: object
          properties:
            name:
              type: string
              example: "Linh Pham"
            email:
              type: string
              example: "linh.pham@beneficiary.com"
        status:
          type: string
          enum: [UNDER_REVIEW, APPROVED, REJECTED]
          example: "UNDER_REVIEW"
        submitted_date_formatted:
          type: string
          example: "Sep 20, 2026"
        documents:
          type: array
          items:
            $ref: '#/components/schemas/VerificationDocumentItem'
        review_guideline:
          type: string
          example: "Confirm the document is authentic and matches the vault owner's legal record before approving this case."

    ApproveCaseResponse:
      type: object
      properties:
        case_id:
          type: string
          format: uuid
        case_number:
          type: string
          example: "LV-1042"
        status:
          type: string
          example: "APPROVED"
        status_label:
          type: string
          example: "Approved"
        approved_title:
          type: string
          example: "Case approved"
        approved_message:
          type: string
          example: "Document verified successfully. Case #LV-1042 was approved and vault unlock has been authorized."
        vault_unlock_authorized:
          type: boolean
          example: true
        verified_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "NOT_FOUND"
        message:
          type: string
          example: "Không tìm thấy hồ sơ yêu cầu."
