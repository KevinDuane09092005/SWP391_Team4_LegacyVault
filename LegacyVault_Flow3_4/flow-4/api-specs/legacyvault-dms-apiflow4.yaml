openapi: 3.0.3
info:
  title: LegacyVault - Dead Man's Switch API
  description: >
    API specification cho Flow 4 của LegacyVault - Dead Man's Switch (DMS):
    cấu hình, giám sát (monitoring loop), check-in, cảnh báo & kích hoạt
    handover khi Vault Owner không phản hồi.

    Nguồn thiết kế:
      - Sequence diagram Flow 4: "1. Cấu hình ban đầu (Configuration)" và
        "2. Vòng lặp giám sát (Monitoring Loop)" (loop + alt lồng nhau: phản
        hồi đúng hạn / không phản hồi -> WARNING -> phản hồi trong Grace Period
        / vẫn không phản hồi -> TRIGGERED -> tạo Handover Case -> notify Executor)
      - DB schema: bảng `dead_mans_switches`, tham chiếu `contacts`, `handover_cases`
      - UI Prototype: flow4-dms-configuration, flow4-dms-active-monitoring,
        flow4-dms-upcoming-warning-state, flow4-dms-warning-state

    ⚠️ ĐIỂM CẦN XÁC NHẬN LẠI VỚI TEAM (assumptions):
      1. **Thiếu bảng lưu lịch sử check-in**: màn "System Health Monitoring"
         có khối "Check-In Audit Log" hiển thị nhiều dòng lịch sử (Owner
         Heartbeat Confirmed, Manual Dashboard Check-in...) kèm kênh xác thực
         (Web App Login, Desktop Console, Mobile Token Auth) và thời gian,
         nhưng bảng `dead_mans_switches` chỉ có đúng 1 cột `last_check_in_at`
         (không lưu lịch sử nhiều lần). Spec này giả định cần thêm bảng mới
         `dms_checkin_logs` (log_id, dms_id, event_type, channel, occurred_at,
         status) để phục vụ màn hình này — cần xác nhận với team DB.
      2. **"Notification Contact" không có cột riêng** trong `dead_mans_switches`.
         Màn Configuration hiển thị sẵn 1 người ("Linh Pham (Executor)") như
         read-only info, không phải dropdown để chọn. Spec giả định BE tự lấy
         từ bảng `contacts` nơi `is_executor = true` thuộc owner hiện tại (lấy
         người đầu tiên nếu có nhiều executor). Cần xác nhận lại logic chọn
         khi Vault Owner có nhiều hơn 1 executor trong Sổ liên lạc.
      3. **Danh sách đầy đủ của dropdown Check-in Interval / Grace Period**:
         UI chỉ thấy "3 Months (Default)" và "14 Days (Recommended)". Enum
         bên dưới tạm đưa ra các mốc phổ biến (1/3/6/12 tháng, 7/14/30 ngày),
         cần xác nhận lại danh sách đầy đủ.
      4. **Badge "CHECK-IN DUE SOON"** (màn flow4-dms-upcoming-warning-state)
         KHÔNG phải là 1 giá trị `status` riêng trong DB. Theo sequence diagram,
         BE chỉ có 3 trạng thái: `active`, `warning`, `triggered`. Badge này là
         FE tự tính toán hiển thị khi còn ít ngày trước `next_check_in_at` (ví
         dụ < 3 ngày) trong khi status vẫn đang là `active`. BE không cần trả
         thêm trạng thái mới, chỉ cần trả `next_check_in_at` chính xác.
      5. **Thời điểm hết Grace Period** không có cột riêng trong DB; spec tính
         toán động: `grace_period_ends_at = next_check_in_at + grace_period_days`
         (áp dụng khi status = "warning" hoặc "triggered"), không cần thêm cột.
      6. **Tạo Handover Case khi TRIGGERED** (bước 16-18 trong sequence diagram)
         là tiến trình nội bộ của Scheduler (ghi vào bảng `handover_cases` có
         sẵn + gửi email Executor), KHÔNG phải API do FE gọi trực tiếp. Các
         endpoint quản lý/xem chi tiết Handover Case (nếu Vault Owner hoặc
         Executor cần xem) nằm ngoài phạm vi 4 màn hình của Flow 4 này và nên
         được thiết kế ở một flow riêng (vd Flow 5 - Handover Execution).
  version: "1.0.0"
  contact:
    name: LegacyVault Backend Team

servers:
  - url: https://api.legacyvault.io/v1
    description: Production
  - url: https://staging-api.legacyvault.io/v1
    description: Staging

tags:
  - name: Dead Man's Switch - Configuration
    description: flow4-dms-configuration
  - name: Dead Man's Switch - Monitoring
    description: flow4-dms-active-monitoring, flow4-dms-upcoming-warning-state, flow4-dms-warning-state

paths:
  /dms/config:
    get:
      tags: [Dead Man's Switch - Configuration]
      summary: Lấy cấu hình Dead Man's Switch hiện tại
      description: >
        Dùng để pre-fill form "Configure Automated Trigger" nếu Vault Owner đã
        từng cấu hình trước đó (nếu chưa từng cấu hình, BE trả 404 để FE hiển
        thị form với giá trị mặc định: 3 Months / 14 Days).
      operationId: getDmsConfig
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cấu hình hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DmsConfig'
              examples:
                default:
                  value:
                    dms_id: "d1b2c3d4-0000-1111-2222-333344445555"
                    check_in_interval_days: 90
                    grace_period_days: 14
                    notification_contact:
                      contact_id: "c1b2c3d4-0000-1111-2222-333344446666"
                      full_name: "Linh Pham"
                      relationship: "other"
                      email: "linh.pham@legacymail.com"
                      is_executor: true
                    status: "active"
                    last_check_in_at: "2026-09-15T14:22:18Z"
                    next_check_in_at: "2026-11-15T09:00:00Z"
                    created_at: "2026-08-15T09:00:00Z"
                    updated_at: "2026-09-15T14:22:18Z"
        '404':
          description: Chưa cấu hình Dead Man's Switch lần nào
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Chưa đăng nhập hoặc token không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Dead Man's Switch - Configuration]
      summary: Lưu / cập nhật cấu hình Dead Man's Switch (Save Configuration)
      description: >
        Tương ứng bước (1)-(4) trong sequence diagram: VO cài đặt Check-in
        Interval & Grace Period trên form -> FE gửi PUT /dms/config -> BE lưu
        cấu hình, đặt `status = active`, tính `next_check_in_at = now() +
        check_in_interval_days`, trả xác nhận thành công. Dùng PUT vì mỗi
        owner chỉ có đúng 1 bản ghi cấu hình (`owner_id UNIQUE` trong DB) -
        gọi lại API này sẽ cập nhật (upsert) thay vì tạo bản ghi mới.
      operationId: saveDmsConfig
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDmsConfigRequest'
            examples:
              default:
                value:
                  check_in_interval_days: 90
                  grace_period_days: 14
      responses:
        '200':
          description: Lưu cấu hình thành công, trạng thái được đặt lại về "active"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DmsConfig'
        '400':
          description: Giá trị check_in_interval_days / grace_period_days không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Chưa đăng nhập hoặc token không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /dms/status:
    get:
      tags: [Dead Man's Switch - Monitoring]
      summary: Lấy trạng thái giám sát hiện tại (dùng cho cả 3 màn hình monitoring)
      description: >
        1 endpoint dùng chung cho cả 3 màn hình trạng thái khác nhau — FE tự
        quyết định hiển thị UI nào dựa theo `status` và khoảng cách đến
        `next_check_in_at` trả về:
          - `status = "active"` & còn nhiều ngày -> "System Health Monitoring"
            (flow4-dms-active-monitoring)
          - `status = "active"` & gần đến hạn (xem Assumption #4) -> "Check-in
            Due Soon" (flow4-dms-upcoming-warning-state)
          - `status = "warning"` -> "Warning: Action Required"
            (flow4-dms-warning-state), `grace_period_ends_at` dùng để tính
            đồng hồ đếm ngược "Grace Period Remaining"
          - `status = "triggered"` -> Handover đã được kích hoạt (ngoài phạm
            vi 4 màn hình Flow 4 - xem Assumption #6)
      operationId: getDmsStatus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Trạng thái giám sát hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DmsStatus'
              examples:
                active:
                  summary: "System Health Monitoring (còn 47 ngày)"
                  value:
                    status: "active"
                    check_in_interval_days: 90
                    grace_period_days: 14
                    last_check_in_at: "2026-09-15T14:22:18Z"
                    next_check_in_at: "2026-11-15T09:00:00Z"
                    grace_period_ends_at: null
                warning:
                  summary: "Warning: Action Required (đang trong Grace Period)"
                  value:
                    status: "warning"
                    check_in_interval_days: 90
                    grace_period_days: 14
                    last_check_in_at: "2026-08-17T09:00:00Z"
                    next_check_in_at: "2026-11-15T09:00:00Z"
                    grace_period_ends_at: "2026-11-29T09:00:00Z"
        '404':
          description: Chưa cấu hình Dead Man's Switch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /dms/checkin:
    post:
      tags: [Dead Man's Switch - Monitoring]
      summary: Thực hiện Check-in (bình thường hoặc khẩn cấp trong Grace Period)
      description: >
        Dùng chung cho cả 3 nút trên UI: "Check-in Now (Reset Timer)" (màn
        Active Monitoring), "Check in now" (màn Check-in Due Soon), và
        "Emergency Check-in (Restore Safe State)" (màn Warning). Tương ứng
        bước (6)-(8) khi status đang "active" (reset timer, giữ nguyên
        "active") hoặc bước (12)-(14) khi status đang "warning" (reset timer,
        đưa trạng thái về lại "active"). BE tự xác định đang ở nhánh nào dựa
        theo status hiện tại, không cần FE truyền thêm cờ phân biệt.
      operationId: performCheckIn
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum: [web_app, desktop_console, mobile_app]
                  default: web_app
                  description: >
                    Kênh xác thực check-in - dùng để ghi vào Check-in Audit Log
                    (vd "Via Web App Login", "Via Desktop Console", "Via Mobile
                    Token Auth"). Xem Assumption #1.
            examples:
              default:
                value:
                  channel: "web_app"
      responses:
        '200':
          description: Check-in thành công, timer được reset, trạng thái trở về "active"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DmsStatus'
              examples:
                default:
                  value:
                    status: "active"
                    check_in_interval_days: 90
                    grace_period_days: 14
                    last_check_in_at: "2026-09-26T10:00:00Z"
                    next_check_in_at: "2026-12-25T10:00:00Z"
                    grace_period_ends_at: null
        '404':
          description: Chưa cấu hình Dead Man's Switch, không thể check-in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            Status hiện tại là "triggered" - Grace Period đã hết hạn, Handover
            Process đã được kích hoạt, không thể check-in để huỷ (cần liên hệ
            hỗ trợ / quy trình khôi phục riêng, ngoài phạm vi spec này).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /dms/checkin-logs:
    get:
      tags: [Dead Man's Switch - Monitoring]
      summary: Lấy lịch sử check-in (Check-In Audit Log)
      description: >
        Dùng cho khối "Check-In Audit Log" trên màn "System Health Monitoring".
        Xem Assumption #1 về bảng `dms_checkin_logs` cần bổ sung vào DB.
      operationId: listCheckInLogs
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Danh sách lịch sử check-in, mới nhất trước
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 3
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CheckInLogEntry'
              examples:
                default:
                  value:
                    total: 3
                    data:
                      - log_id: "l1b2c3d4-0000-1111-2222-333344445555"
                        event_type: "owner_heartbeat_confirmed"
                        event_label: "Owner Heartbeat Confirmed"
                        channel: "web_app"
                        channel_label: "Via Web App Login"
                        status: "verified"
                        occurred_at: "2026-09-15T14:22:18Z"
                      - log_id: "l1b2c3d4-0000-1111-2222-333344446666"
                        event_type: "manual_checkin"
                        event_label: "Manual Dashboard Check-in"
                        channel: "desktop_console"
                        channel_label: "Via Desktop Console"
                        status: "verified"
                        occurred_at: "2026-06-12T09:10:45Z"
                      - log_id: "l1b2c3d4-0000-1111-2222-333344447777"
                        event_type: "owner_heartbeat_confirmed"
                        event_label: "Owner Heartbeat Confirmed"
                        channel: "mobile_app"
                        channel_label: "Via Mobile Token Auth"
                        status: "verified"
                        occurred_at: "2026-03-11T18:41:02Z"
        '404':
          description: Chưa cấu hình Dead Man's Switch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SaveDmsConfigRequest:
      type: object
      description: Khớp form "Configure Automated Trigger" (Check-in Interval, Grace Period).
      required: [check_in_interval_days, grace_period_days]
      properties:
        check_in_interval_days:
          type: integer
          enum: [30, 90, 180, 365]
          description: >
            Dropdown "Check-in Interval" - "The maximum frequency you are
            required to sign in and confirm you are safe." Mặc định 90 ngày
            (~3 Months). Xem Assumption #3 về danh sách đầy đủ.
          example: 90
        grace_period_days:
          type: integer
          enum: [7, 14, 30]
          description: >
            Dropdown "Grace Period" - "Extra time granted after a missed
            scheduled check-in before verification triggers." Mặc định/khuyến
            nghị 14 ngày. Xem Assumption #3.
          example: 14

    DmsConfig:
      type: object
      description: Ánh xạ từ bảng `dead_mans_switches`, kèm `notification_contact` lấy từ `contacts` (xem Assumption #2).
      properties:
        dms_id:
          type: string
          format: uuid
        check_in_interval_days:
          type: integer
          example: 90
        grace_period_days:
          type: integer
          example: 14
        notification_contact:
          $ref: '#/components/schemas/NotificationContact'
        status:
          type: string
          enum: [active, warning, triggered]
          example: "active"
        last_check_in_at:
          type: string
          format: date-time
        next_check_in_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NotificationContact:
      type: object
      description: >
        Rút gọn từ bảng `contacts` - người sẽ được thông báo khi switch
        chuyển sang "warning"/"triggered" (hiển thị "Linh Pham (Executor) —
        linh.pham@legacymail.com" trên UI). Xem Assumption #2.
      properties:
        contact_id:
          type: string
          format: uuid
        full_name:
          type: string
          example: "Linh Pham"
        relationship:
          type: string
        email:
          type: string
          format: email
        is_executor:
          type: boolean
          example: true

    DmsStatus:
      type: object
      description: Dùng cho GET /dms/status và response của POST /dms/checkin.
      properties:
        status:
          type: string
          enum: [active, warning, triggered]
        check_in_interval_days:
          type: integer
        grace_period_days:
          type: integer
        last_check_in_at:
          type: string
          format: date-time
        next_check_in_at:
          type: string
          format: date-time
          description: >
            Dùng để FE hiển thị đồng hồ đếm ngược "NEXT CHECK-IN DUE IN" /
            "TIME UNTIL CHECK-IN DEADLINE".
        grace_period_ends_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Chỉ có giá trị khi status = "warning" hoặc "triggered". Tính bằng
            `next_check_in_at + grace_period_days` (xem Assumption #5). Dùng
            để FE hiển thị "GRACE PERIOD REMAINING".

    CheckInLogEntry:
      type: object
      description: Ánh xạ từ bảng (đề xuất mới) `dms_checkin_logs` - xem Assumption #1.
      properties:
        log_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum: [owner_heartbeat_confirmed, manual_checkin, emergency_checkin, warning_triggered, grace_period_started, handover_triggered]
        event_label:
          type: string
          description: Nhãn hiển thị sẵn cho FE, vd "Owner Heartbeat Confirmed".
          example: "Owner Heartbeat Confirmed"
        channel:
          type: string
          enum: [web_app, desktop_console, mobile_app, system]
        channel_label:
          type: string
          example: "Via Web App Login"
        status:
          type: string
          enum: [verified]
          description: Hiện tại UI chỉ thấy badge "Verified"; có thể mở rộng thêm "failed" nếu cần sau này.
        occurred_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error_code:
          type: string
          example: "DMS_NOT_CONFIGURED"
        message:
          type: string
          example: "Bạn chưa cấu hình Dead Man's Switch."
